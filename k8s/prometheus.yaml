apiVersion: v1
kind: ConfigMap
metadata:
  name: hify-prometheus-config
  labels:
    app: hify-prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: hify-backend
        metrics_path: /actuator/prometheus
        scrape_interval: 15s
        static_configs:
          - targets:
              - hify-backend:8080
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hify-prometheus-data
  labels:
    app: hify-prometheus
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hify-prometheus
  labels:
    app: hify-prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hify-prometheus
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: hify-prometheus
    spec:
      securityContext:
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.3
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=15d
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
              readOnly: true
            - name: data
              mountPath: /prometheus
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
      volumes:
        - name: config
          configMap:
            name: hify-prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: hify-prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: hify-prometheus
  labels:
    app: hify-prometheus
spec:
  type: ClusterIP
  selector:
    app: hify-prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
