apiVersion: v1
kind: ConfigMap
metadata:
  name: hify-backend-config
  labels:
    app: hify-backend
data:
  SPRING_PROFILES_ACTIVE: "prod"
  SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/hify?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
  SPRING_DATA_REDIS_HOST: "redis"
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_DATA_REDIS_DATABASE: "0"
  HIFY_POSTGRES_URL: "jdbc:postgresql://postgres:5432/hify_vector"
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "20"
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "5"
  SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: "3000"
  SPRING_DATA_REDIS_LETTUCE_POOL_MAX_ACTIVE: "32"
  SPRING_DATA_REDIS_LETTUCE_POOL_MAX_IDLE: "16"
  SPRING_DATA_REDIS_LETTUCE_POOL_MIN_IDLE: "4"
  HIFY_JOBS_LOG_RETENTION_DAYS: "90"
  HIFY_JOBS_RUNTIME_LOG_RETENTION_DAYS: "90"
  HIFY_JOBS_AUDIT_LOG_RETENTION_DAYS: "180"
  HIFY_JOBS_JOB_LOG_RETENTION_DAYS: "30"
  HIFY_JOBS_ARCHIVE_ENABLED: "true"
  HIFY_JOBS_ARCHIVE_BATCH_SIZE: "500"
  HIFY_JOBS_ARCHIVE_RETENTION_DAYS: "365"
  HIFY_CONVERSATION_SSE_MAX_ACTIVE_CONNECTIONS: "500"
  JAVA_OPTS: "-XX:MaxRAMPercentage=75.0 -XX:+UseG1GC -Djava.security.egd=file:/dev/./urandom"
---
apiVersion: v1
kind: Secret
metadata:
  name: hify-backend-secret
  labels:
    app: hify-backend
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: "hify"
  SPRING_DATASOURCE_PASSWORD: "change-me"
  SPRING_DATA_REDIS_PASSWORD: "change-me"
  HIFY_POSTGRES_USERNAME: "hify"
  HIFY_POSTGRES_PASSWORD: "change-me"
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  GEMINI_API_KEY: ""
  DASHSCOPE_API_KEY: ""
  DEEPSEEK_API_KEY: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hify-backend
  labels:
    app: hify-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hify-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: hify-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      terminationGracePeriodSeconds: 75
      containers:
        - name: hify-backend
          image: hify-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: hify-backend-config
            - secretRef:
                name: hify-backend-secret
          volumeMounts:
            - name: logs
              mountPath: /app/logs
            - name: uploads
              mountPath: /app/upload
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 20"]
          startupProbe:
            httpGet:
              path: /api/v1/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /api/v1/health/liveness
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
      volumes:
        - name: logs
          emptyDir: {}
        - name: uploads
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: hify-backend
  labels:
    app: hify-backend
spec:
  type: ClusterIP
  selector:
    app: hify-backend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hify-backend
  labels:
    app: hify-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hify-backend
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hify-backend
  labels:
    app: hify-backend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: hify-backend
