server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: hify
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

  # ── Flyway 数据库迁移 ───────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true        # 已有数据库时从 baseline 版本开始
    validate-on-migrate: true

  # ── MySQL 主数据库 ──────────────────────────────────────────────────────────
  datasource:
    url: jdbc:mysql://localhost:3306/hify?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: hify
    password: hify123
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: HikariPool-MySQL
      maximum-pool-size: 20        # CLAUDE.md: HikariCP maximumPoolSize=20
      minimum-idle: 5
      connection-timeout: 3000     # CLAUDE.md: connectionTimeout=3000ms
      idle-timeout: 600000         # 10 min
      max-lifetime: 1800000        # 30 min，小于 MySQL wait_timeout（默认 8h）
      keepalive-time: 60000        # 防止防火墙断开空闲连接

  # ── Redis ─────────────────────────────────────────────────────────────────
  data:
    redis:
      host: localhost
      port: 6379
      password: ""
      database: 0
      lettuce:
        pool:
          max-active: 16           # CLAUDE.md Redis 连接池配置
          max-idle: 8
          min-idle: 2
          max-wait: 1000ms

# ── MyBatis-Plus ──────────────────────────────────────────────────────────
mybatis-plus:
  # Mapper XML 扫描路径，覆盖各业务模块下的 resources/mapper/
  mapper-locations: classpath*:/mapper/**/*.xml
  # 当前项目未使用 Mapper XML 类型别名。避免扫描业务配置类导致同名 alias 冲突。
  global-config:
    db-config:
      logic-delete-value: 1        # CLAUDE.md: deleted=1 表示已删除
      logic-not-delete-value: 0    # deleted=0 表示正常
      id-type: auto                # 主键策略：数据库自增
  configuration:
    map-underscore-to-camel-case: true   # created_at → createdAt（默认开启，显式声明）
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl   # SQL 日志通过 SLF4J 输出
    default-fetch-size: 100
    default-statement-timeout: 30

# ── Spring Boot Actuator ──────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

# ── Resilience4j ─────────────────────────────────────────────────────────
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        # 慢调用（>30s）也计入失败率，防止长尾拖垮熔断窗口
        slow-call-duration-threshold: 30s
        slow-call-rate-threshold: 80
        register-health-indicator: true
        # CallNotPermittedException 不计入失败统计，避免熔断器自我强化
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException

# ── 自定义配置 ────────────────────────────────────────────────────────────
hify:
  cors:
    allowed-origins: "*"
  auth:
    enabled: true
    session-days: 7
    init-admin:
      username: ${HIFY_INIT_ADMIN_USERNAME:admin}
      password: ${HIFY_INIT_ADMIN_PASSWORD:}
  llm:
    fallback:
      OPENAI: OLLAMA
      CLAUDE: OPENAI
      DEEPSEEK: OPENAI
      GEMINI: OLLAMA
  postgres:
    url: jdbc:postgresql://localhost:5433/hify_vector
    username: hify
    password: hify_pg123
  knowledge:
    max-file-size-bytes: 209715200
    embedding-batch-size: 32
    max-chunks-per-document: 50000
    max-split-steps: 100000

# ── 日志级别（格式和滚动策略由 logback-spring.xml 管理）────────────────────
logging:
  level:
    root: INFO
    com.hify: INFO
