display_name: Hify Integration Test
short_description: Plan and implement Hify Spring Boot integration tests with mock profile, H2, MockMvc, and red-green bug fixes.
default_prompt: Use this skill when planning or writing Hify module integration tests. First confirm mock profile and H2 setup, then produce a P0/P1/P2 test list, write one scenario at a time with @Sql isolated data, mock external APIs, keep DB real with H2, and use red-green flow for known bugs.
