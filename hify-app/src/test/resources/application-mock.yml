spring:
  cache:
    type: none
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:hify_mock;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
  sql:
    init:
      mode: always
      schema-locations: classpath:db/mock/schema.sql
  data:
    redis:
      repositories:
        enabled: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    root: WARN
    com.hify: INFO

hify:
  auth:
    enabled: false
  jobs:
    enabled: false
  knowledge:
    recovery-enabled: false
  workflow:
    cleanup-enabled: false
  init:
    default-provider:
      enabled: false
  postgres:
    url: jdbc:h2:mem:hify_mock;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
